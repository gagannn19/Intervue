# Cloud Build pipeline: build -> tag with commit SHA -> push to Artifact
# Registry -> deploy that exact image to Cloud Run.
#
# Triggered on every push/merge to `master` (see DEPLOY.md for the trigger).
# $PROJECT_ID and $COMMIT_SHA are provided automatically by Cloud Build.

substitutions:
  _REGION: "asia-south1"
  _AR_REPO: "intervue-frontend"
  _SERVICE: "intervue-frontend"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}"

# Firebase web config (not secret, but sourced from Secret Manager for
# convenience of one place to manage per-environment values — see
# cuecast-intervue-frontend). Content is .env-style lines
# (VITE_FIREBASE_API_KEY=..., etc.), parsed into build-args below.
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/cuecast-intervue-frontend/versions/latest
      env: "FRONTEND_ENV_FILE"

steps:
  # 1. Build the production image, pinned to this commit.
  - id: build
    name: "gcr.io/cloud-builders/docker"
    entrypoint: sh
    secretEnv: ["FRONTEND_ENV_FILE"]
    args:
      - "-c"
      - |
        set -eu
        set -a
        eval "$$FRONTEND_ENV_FILE"
        set +a
        docker build \
          --build-arg VITE_API_URL="$$VITE_API_URL" \
          --build-arg VITE_FIREBASE_API_KEY="$$VITE_FIREBASE_API_KEY" \
          --build-arg VITE_FIREBASE_AUTH_DOMAIN="$$VITE_FIREBASE_AUTH_DOMAIN" \
          --build-arg VITE_FIREBASE_PROJECT_ID="$$VITE_FIREBASE_PROJECT_ID" \
          --build-arg VITE_FIREBASE_STORAGE_BUCKET="$$VITE_FIREBASE_STORAGE_BUCKET" \
          --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="$$VITE_FIREBASE_MESSAGING_SENDER_ID" \
          --build-arg VITE_FIREBASE_APP_ID="$$VITE_FIREBASE_APP_ID" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}" \
          .

  # 2. Push the immutable, SHA-tagged image to Artifact Registry.
  - id: push
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}"

  # 3. Deploy that exact image (by SHA, never `latest`) to Cloud Run.
  #    Each deploy creates a new revision automatically.
  - id: deploy
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--port=8080"
      - "--allow-unauthenticated"
      - "--cpu=1"
      - "--memory=512Mi"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--concurrency=80"
      # No --set-env-vars: this is a static bundle. VITE_API_URL is a
      # build-time value (baked in at step 1), not a runtime nginx setting.

timeout: "1200s"
